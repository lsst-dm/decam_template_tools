# Calibration QA thresholds and parameters for verify/calibs/run_*_qa.py.
#
# PLACEHOLDER: every number in this file is a first guess from DECam documentation
# and a look at detectors 10-11, not a derived value. Use it to exercise the pipeline, then
# replace it with a config written by `--build-baseline` from a known-good collection,
# or edit it by hand.
#
# Per metric: warn / fail are [lo, hi] (null = unbounded). `mode` is absolute (default),
# offset (reference + lo/hi) or fraction (reference * (1 + lo/hi)). A metric with no
# warn/fail is reported with flag `info`. Overrides for single amps go under
# <type>.per_amp."<detector>".<amp>.<metric> and replace keys of the default.
# baseline_side (upper/lower/both) and baseline_min_abs control --build-baseline.
placeholder: true

# Pixels in these mask planes (plus non-finite pixels) are ignored by every metric.
mask_planes: [BAD, SAT, NO_DATA, SUSPECT, UNMASKEDNAN]

# Measured but reported with flag `skip`. Optional keys: amp, dataset_types, reason.
# Other known cases to consider adding: detector 2 (S30), off 2013-11 to 2016-12, and
# detector 31 (S7) amp B, unstable gain (flats).
known_bad:
  - {detector: 61, reason: "N30, dead since 2012-11"}  # PLACEHOLDER: confirm

# --build-baseline: reference = median over the baseline collection's calibs;
# half-widths = max(k * MAD-sigma, min_frac * |reference|, baseline_min_abs).
baseline:
  k_warn: 3.0  # PLACEHOLDER
  k_fail: 5.0  # PLACEHOLDER
  min_frac_warn: 0.1  # PLACEHOLDER
  min_frac_fail: 0.2  # PLACEHOLDER

bias:
  params:
    input_dataset_type: cpBiasIsrExp  # single frames, looked up in the master's RUN
    raw_observation_type: zero  # raw fallback when the RUN has no single frames
    n_noise_frames: 6  # single frames read in full, spread over the sequence (3 pairs)
    poly_order: 2
    poly_bin: 32  # pixels per bin before the 2D fit
    smooth_box: 32  # smooth term of the structure model removed before hot pixels / noise
    profile_nsigma: 5.0
    pickup_fmin: 0.01  # cycles/pixel; lower frequencies count as structure, not pickup
    pickup_continuum: 51  # frequency bins in the running-median continuum
    outlier_nsigma: 10.0  # PLACEHOLDER; input overscan level vs the sequence median
    outlier_min_adu: 20.0  # PLACEHOLDER
    outlier_noise_ratio: 1.5  # PLACEHOLDER; input overscan noise / median
    hot_nsigma: 7.0  # PLACEHOLDER
    hot_min_adu: 3.0  # PLACEHOLDER
    col_nsigma: 7.0  # PLACEHOLDER
    col_min_adu: 1.0  # PLACEHOLDER
    col_filter: 31  # columns in the running median a column is compared against
    thumb_bin: 32
  metrics:
    overscan_level_adu: {warn: [1000, 5000], fail: [500, 10000]}  # PLACEHOLDER
    overscan_stability_adu: {warn: [null, 5], fail: [null, 20]}  # PLACEHOLDER
    n_outlier_inputs: {warn: [null, 0.5], fail: [null, 5.5], baseline_side: upper, baseline_min_abs: 0.5}  # PLACEHOLDER
    bias_median_adu: {warn: [-5, 5], fail: [-20, 20]}  # PLACEHOLDER
    read_noise_e: {reference: 6.5, warn: [4, 9], fail: [2, 12]}  # PLACEHOLDER
    read_noise_overscan_e: {reference: 6.5, warn: [4, 9], fail: [2, 12]}  # PLACEHOLDER
    single_bias_sigma_e: {warn: [null, 12], fail: [null, 20]}  # PLACEHOLDER
    col_profile_rms_adu: {warn: [null, 1.0], fail: [null, 3]}  # PLACEHOLDER
    row_profile_rms_adu: {warn: [null, 0.5], fail: [null, 2]}  # PLACEHOLDER
    poly2d_ptp_adu: {warn: [null, 5], fail: [null, 10]}  # PLACEHOLDER
    pickup_peak_ratio: {warn: [null, 2.5], fail: [null, 5]}  # PLACEHOLDER
    pickup_peak_freq: {}  # info only
    interamp_row_corr: {warn: [-0.3, 0.3], fail: [-0.6, 0.6]}  # PLACEHOLDER
    n_hot_pix: {warn: [null, 5000], fail: [null, 20000], baseline_side: upper, baseline_min_abs: 50}  # PLACEHOLDER
    n_bad_cols: {warn: [null, 5], fail: [null, 20], baseline_side: upper, baseline_min_abs: 2}  # PLACEHOLDER
    n_new_defect_pix: {warn: [null, 5000], fail: [null, 50000], baseline_side: upper, baseline_min_abs: 100}  # PLACEHOLDER
    master_noise_ratio: {reference: 1.0, warn: [0.8, 1.5], fail: [0.6, 3.0]}  # PLACEHOLDER
  per_amp: {}

flat:
  params:
    input_dataset_type: cpFlatIsrExp  # single frames, looked up in the master's RUN
    n_noise_frames: 2  # well-exposed single frames read in full for input_noise_ratio
    edge_margin: 30  # pixels at the CCD border left out of pixel metrics (bright edges)
    model_box: 128  # smooth model for the high-pass (dust, low QE, tree rings)
    pix_box: 32  # smooth model for the pixel-to-pixel RMS
    low_count_adu: 5000.0  # PLACEHOLDER; inputs below this are low-count
    low_qe_level: 0.9  # PLACEHOLDER; pixels below this x the local level are low QE
    treering_sigma: 3.0  # Gaussian smoothing (px) of the high-pass for the tree-ring proxy
    spot_sigma: 2.0
    spot_nsigma: 5.0  # PLACEHOLDER
    spot_min_area: 12
    spot_max_area: 40000
    spot_max_elong: 3.0  # longer, thinner depressions are tree-ring arcs, not dust
    spot_min_depth: 0.005  # PLACEHOLDER; 0.5% deep
    edge_width: 10
    edge_ref: [20, 60]  # band (px in from the edge) the outer edge_width px are compared to
    boundary_width: 20  # amp-boundary strips for amp_ratio and stitching
    boundary_gap: 4
    gradient_order: 2
    gradient_bin: 64
    ref_tol: 0.01  # PLACEHOLDER; |master / reference - 1| beyond this counts as changed
    thumb_bin: 32
  metrics:
    input_level_adu: {warn: [8000, 35000], fail: [3000, 45000]}  # PLACEHOLDER
    input_level_scatter_frac: {warn: [null, 0.1], fail: [null, 0.5]}  # PLACEHOLDER
    n_low_count_inputs: {warn: [null, 0.5], fail: [null, 5.5], baseline_side: upper, baseline_min_abs: 0.5}  # PLACEHOLDER
    max_level_sat_frac: {warn: [null, 0.7], fail: [null, 0.9]}  # PLACEHOLDER
    max_sat_pix_frac: {warn: [null, 0.0001], fail: [null, 0.01]}  # PLACEHOLDER
    master_median: {}  # info only
    pix_rms_frac: {warn: [null, 0.009], fail: [null, 0.015]}  # PLACEHOLDER
    master_poisson_frac: {}  # info only
    pix_rms_poisson_ratio: {}  # info only: PRNU dominates the master's pixel RMS
    input_noise_ratio: {reference: 1.0, warn: [0.85, 1.1], fail: [0.7, 1.3]}  # PLACEHOLDER
    low_qe_frac: {warn: [null, 0.001], fail: [null, 0.01]}  # PLACEHOLDER
    n_dust_spots: {warn: [null, 60], fail: [null, 150], baseline_side: upper, baseline_min_abs: 5}  # PLACEHOLDER
    treering_proxy_frac: {warn: [null, 0.004], fail: [null, 0.008]}  # PLACEHOLDER
    edge_feature_frac: {warn: [-0.2, 1.5], fail: [-0.5, 3.0]}  # PLACEHOLDER; DECam edges are bright
    amp_ratio: {}  # info only; see amp_ratio_vs_gain
    amp_ratio_vs_gain: {reference: 1.0, warn: [0.99, 1.01], fail: [0.97, 1.03]}  # PLACEHOLDER
    gradient_ptp_frac: {warn: [null, 0.06], fail: [null, 0.15]}  # PLACEHOLDER
    ref_amp_ratio: {reference: 1.0, warn: [0.995, 1.005], fail: [0.98, 1.02]}  # PLACEHOLDER
    ref_ratio_rms: {warn: [null, 0.003], fail: [null, 0.01]}  # PLACEHOLDER
    ref_ratio_frac_out: {warn: [null, 0.005], fail: [null, 0.05]}  # PLACEHOLDER
    n_new_dust_spots: {warn: [null, 10], fail: [null, 30], baseline_side: upper, baseline_min_abs: 3}  # PLACEHOLDER
  per_amp: {}

fringe:
  params:
    input_dataset_type: cpFringeMeasuredIsrExp  # sky-normalized inputs in the template's RUN
    n_science: 12  # exposures fitted per template (another period's inputs, or --science-collection)
    frame_mask_planes: [BAD, SAT, NO_DATA, SUSPECT, UNMASKEDNAN, DETECTED, INTRP, EDGE]
    edge_margin: 30
    smooth_box: 256  # per-amp median model removed before measuring fringes
    bin: 8  # fringe amplitude and fits use bin x bin binned images (template noise)
    coherence_bin: 32
    boundary_width: 20
    boundary_gap: 4
    outlier_nsigma: 5.0  # PLACEHOLDER; |z| of scale residuals from the scale-vs-sky fit
    scale_intrinsic_frac: 0.1  # PLACEHOLDER; night-to-night OH variability added to fit errors
    thumb_bin: 32
  metrics:
    fringe_rms_frac: {warn: [null, 0.0005], fail: [null, 0.002]}  # PLACEHOLDER; DECam z ~1e-4
    fringe_ptp_frac: {}  # info only
    template_noise_frac: {warn: [null, 0.001], fail: [null, 0.003]}  # PLACEHOLDER
    template_snr: {warn: [0.5, null], fail: [0.25, null]}  # PLACEHOLDER; per bin x bin pixel
    n_template_inputs: {warn: [20, null], fail: [5, null]}  # PLACEHOLDER
    amp_step_frac: {warn: [-0.0001, 0.0001], fail: [-0.0005, 0.0005]}  # PLACEHOLDER
    ref_template_corr: {}  # info only; see ref_template_coherence
    ref_template_coherence: {reference: 1.0, warn: [0.3, null], fail: [0.1, null]}  # PLACEHOLDER
    n_science: {warn: [5, null], fail: [2, null]}  # PLACEHOLDER
    scale_median: {}  # info only: depends on the sky levels of the fitted frames
    scale_snr_median: {}  # info only
    residual_rms_frac: {warn: [null, 0.002], fail: [null, 0.005]}  # PLACEHOLDER
    residual_excess_frac: {warn: [null, 0.001], fail: [null, 0.003]}  # PLACEHOLDER
    fringe_removed_frac: {}  # info only: small when frames are dominated by other structure
    scale_sky_corr: {}  # info only: strongly negative on DECam (fringes vanish in bright sky)
    n_scale_outliers: {warn: [null, 0.5], fail: [null, 3.5], baseline_side: upper, baseline_min_abs: 0.5}  # PLACEHOLDER
    scale_time_jump_sigma: {warn: [null, 2.0], fail: [null, 5.0]}  # PLACEHOLDER; ~1 = noise only
  per_amp: {}
