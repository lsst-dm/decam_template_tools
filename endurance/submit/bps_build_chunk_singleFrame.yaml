# Stage 2 of 3: single-frame processing (isr + calibrateImage) for one sky chunk.
# Run by run_chunk.sh after the overscan job; bps_build_chunk_template.yaml
# builds the templates from this job's outputs.

# Set by run_chunk.sh (CHUNK, DET_CONSTRAINT): the sky window from chunk_grid.py
# minus the exposures and CCDs on the exclude lists, DELVE and corrupt raws
# (delve_exclude.py).
chunk: ${CHUNK}
detConstraint: "${DET_CONSTRAINT}"
# Chain written by the overscan job (bps_build_chunk_overscanRaws.yaml).
overscanRawColl: "u/{operator}/DECam/endurance/overscanRaws/chunk{chunk}"

# Only the singleFrame subset of QuickTemplate.yaml (isr, calibrateImage).
pipelineYaml: "$AP_PIPE_DIR/pipelines/DECam/QuickTemplate.yaml#singleFrame"

# Just names, but UPDATE THIS AND KEEP THEM SHORT
project: "DECam_Templates"
campaign: "chunk{chunk}_SingleFrame"
# Submit dir in the operator's own scratch; see bps_build_chunk_overscanRaws.yaml.
submitPath: ${PSCRATCH}/endurance_submit/{outputRun}

payload:
  # bps makes u/{operator}/{payloadName} a CHAINED collection of this run plus
  # inCollection; the template job takes its inputs from that chain.
  payloadName: "DECam/endurance/singleFrame/chunk{chunk}"
  butlerConfig: /global/cfs/cdirs/lsst/production/gen3/rubin/decam/repo/butler.yaml
  # refcats/DM-49042/... holds the_monster_20250219 shards for calibrateImage.
  # No skymaps: nothing in this subset has a tract or patch dimension.
  inCollection: DECam/raw/all,DECam/calib/curated,{overscanRawColl},DECam/calib/bias,DECam/calib/flat,DECam/calib/fringe,refcats/DM-49042/the_monster_20250219
  # All dates; detector 2 (S30) is cut before 2016-12-29, when it began working
  # again. Keep in sync with SF_WHERE in run_chunk.sh.
  dataQuery: "instrument='DECam' AND exposure.observation_type='science' AND detector NOT IN (61,31) AND NOT (detector=2 AND exposure.day_obs<20161229) AND {detConstraint}"

# obs_decam/config/calibrateImage.py already points both refcats at the monster
# for this instrument, but pin it here so a stack update can't silently move us
# back to gaia_dr3/ps1 without the inCollection above changing to match.
#
# --skip-existing-in resumes rather than reprocesses: any quantum whose metadata
# dataset is already registered in that run is dropped from the graph, and its
# existing outputs are wired in as inputs to whatever consumes them. A quantum
# that died before writing metadata is NOT skipped, so the failed calibrateImage
# is still regenerated. Update the run name on each resume; drop the line for a
# from-scratch build.
#
# isr takes its crosstalk sources from the overscan job's overscanRaw, as
# $CP_PIPE_DIR/pipelines/DECam/cpFlat.yaml does; IsrTask's default name,
# isrOverscanCorrected, matches nothing here, and since the connection is
# optional isr would silently skip inter-CCD crosstalk.
extraQgraphOptions: >-
  --dataset-query-constraint off
  -c isr:connections.crosstalkSources=overscanRaw
  -c calibrateImage:connections.astrometry_ref_cat=the_monster_20250219
  -c calibrateImage:connections.photometry_ref_cat=the_monster_20250219

# calibrateImage catches AlgorithmError, writes the partial visit_image with a
# failure.message header, then re-raises; by default that exits the whole
# run-qbb process non-zero, so a single star-poor detector fails its entire
# cluster job and everything downstream of it. Star-poor DECam detectors are
# expected in this pilot, and makeDirectWarp already drops detectors whose
# visit_summary row is missing or has no PhotoCalib/WCS, so let the process
# treat a partial output as a qualified success and keep going.
extraRunQuantumOptions: "--no-raise-on-partial-outputs"

# isr is (exposure, detector) and calibrateImage is (visit, detector); on
# DECam visit == exposure, so equalDimensions lets them share a cluster and
# calibrateImage picks up the post_isr_image its cluster-mate just wrote.
# Chunked to at most 1000 jobs the same way bps_build_bias.yaml and
# bps_build_flat.yaml size their ISR steps.
clusterAlgorithm: lsst.ctrl.bps.quantum_clustering_funcs.dimension_clustering
cluster:
  single_frame:
    pipetasks: isr,calibrateImage
    dimensions: detector
    equalDimensions: visit:exposure
    partitionDimensions: exposure
    partitionMaxClusters: 1000

# Memory is looked up by job name, so a clustered task needs the value on its
# cluster label; the bare task label is kept for the unclustered case. TaskVine
# packs jobs onto the 480 GB worker by this request, so it sets how many run at
# once: the pilot's isr+calibrateImage peaked at 1.3 GB, and 3 GB lets ~160 run
# instead of the 60 an 8 GB request allowed.
pipetask:
  single_frame:
    requestMemory: 3000
  isr:
    requestMemory: 3000

computeSite: "task_vine"
wmsServiceClass: lsst.ctrl.bps.parsl.ParslService

parsl:
  log_level: INFO

site:
  local:
    class: lsst.ctrl.bps.parsl.sites.Local
    cores: 8
  triple_slurm:
    class: lsst.ctrl.bps.parsl.sites.TripleSlurm
    nodes: 1
    cores_per_node: 100
    qos: normal
    small_memory: 2.0     # Units are GB
    medium_memory: 4.0
    large_memory: 8.0
    small_walltime: 10.0   # Units are hours
    medium_walltime: 10.0
    large_walltime: 40.0
    monitorEnable: true
    monitorFilename: runinfo/monitoring.db
  # A chunk is ~231k isr+calibrateImage pairs at ~37 s each (pilot), ~2.4k
  # task-hours: about 2.5 h on 8 nodes, against ~40 h on one.
  task_vine:
    class: bps_parsl_sites.SlurmTaskVine
    walltime: "06:00:00"
    qos: regular
    constraint: cpu
    exclusive: true
    nodes_per_block: 1
    # 8 one-node blocks, not one 8-node block: work starts when the first node
    # is granted and the rest join the same TaskVine manager as they come up
    # (a single 8-node block would wait for 8 free nodes at once). Keep these
    # literal ints; bps would substitute an env var as a string, which Parsl
    # rejects.
    provider_options:
      init_blocks: 8
      min_blocks: 0
      max_blocks: 8
    scheduler_options: |
      #SBATCH --module=cvmfs
      #SBATCH --account=m1727
    worker_options: "--memory=480000"  # total memory in MB
    monitorEnable: true
    monitorFilename: runinfo/monitoring.db
