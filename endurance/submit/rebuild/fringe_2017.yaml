includeConfigs:
  - /global/u1/d/descdm/seanmacb/decam_template_tools/endurance/submit/bps_build_fringe.yaml
year: "2017"
submitPath: "/pscratch/sd/d/descdm/butlersubmits/{outputRun}"  # repo symlink ./submit points at seanmacb scratch
band: "z"
range: "AND (day_obs > 20170000) AND (day_obs < 20180000)"
extraQgraphOptions: "--dataset-query-constraint off --skip-existing-in u/descdm/DECam/calib/ELAIS_pilot/fringe_v2/2017/20261028T225158Z"
payload:
  payloadName: "DECam/calib/ELAIS_pilot/fringe_v2/{year}"
  dataQuery: "instrument='DECam' {range} AND band='{band}' AND exposure.observation_type='science' AND NOT (detector=4 AND exposure=649905)"
