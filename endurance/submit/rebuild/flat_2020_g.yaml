includeConfigs:
  - /global/u1/d/descdm/seanmacb/decam_template_tools/endurance/submit/bps_build_flat.yaml
year: "2020"
submitPath: "/pscratch/sd/d/descdm/butlersubmits/{outputRun}"  # repo symlink ./submit points at seanmacb scratch
band: "g"
range: "AND (day_obs > 20200000) AND (day_obs < 20210000)"
# truncated raw (932221, det 41) failed cpFlatIsr in the first build; skip the 4091 ISR/measure quanta that succeeded
extraQgraphOptions: "--dataset-query-constraint off --skip-existing-in u/descdm/DECam/calib/ELAIS_pilot/flat_v2/2020/g_band/20261030T103603Z"
payload:
  payloadName: "DECam/calib/ELAIS_pilot/flat_v2/{year}/{band}_band"
  dataQuery: "instrument='DECam' {range} AND band='{band}' AND exposure.observation_type='dome flat' AND NOT (detector=51 AND exposure=598458) AND NOT (detector=41 AND exposure=932221)"
