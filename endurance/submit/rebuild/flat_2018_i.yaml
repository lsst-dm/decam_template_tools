includeConfigs:
  - /global/u1/d/descdm/seanmacb/decam_template_tools/endurance/submit/bps_build_flat.yaml
year: "2018"
submitPath: "/pscratch/sd/d/descdm/butlersubmits/{outputRun}"  # repo symlink ./submit points at seanmacb scratch
band: "i"
range: "AND (day_obs > 20180000) AND (day_obs < 20190000)"
payload:
  payloadName: "DECam/calib/ELAIS_pilot/flat_v2/{year}/{band}_band"
  dataQuery: "instrument='DECam' {range} AND band='{band}' AND exposure.observation_type='dome flat' AND NOT (detector=51 AND exposure=598458) AND exposure NOT IN (767733,767734,767735,767736,767737,767738,767739,767740,767741,767742,767743)"
