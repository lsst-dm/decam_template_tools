includeConfigs:
  - /global/u1/d/descdm/seanmacb/decam_template_tools/endurance/submit/bps_build_bias.yaml
year: "2021"
submitPath: "/pscratch/sd/d/descdm/butlersubmits/{outputRun}"  # repo symlink ./submit points at seanmacb scratch
range: "AND (day_obs > 20210000) AND (day_obs < 20220000)"
# corrupt raw (cfitsio read error) for detector 57 of 995710 blocked that detector's master in the
# first build (run 20261029T160500Z); skip the ISR quanta that already succeeded
extraQgraphOptions: "--dataset-query-constraint off --skip-existing-in u/descdm/DECam/calib/ELAIS_pilot/bias_v2/2021/20261029T160500Z"
payload:
  payloadName: "DECam/calib/ELAIS_pilot/bias_v2/{year}"
  dataQuery: "instrument='DECam' {range} AND exposure.observation_type='zero' AND exposure.target_name IN ('preflats-BIAS','postflats-BIAS','postnight-BIAS') AND exposure NOT IN (558294,581640,558395) AND NOT (detector=57 AND exposure=995710)"
