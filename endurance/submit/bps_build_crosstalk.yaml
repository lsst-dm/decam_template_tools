year: "2013" # Options: 2013-2026, except 2015

FLATEXPS: ""
SCIEXPS: ""

# UPDATE THIS to the path to the pipeline to run
pipelineYaml: $DRP_PIPE_DIR/pipelines/DECam/DRP-Merian.yaml#step0 # First step
# pipelineYaml: "$CP_PIPE_DIR/pipelines/DECam/cpCrosstalk.yaml" # Second step

# Just names, but UPDATE THIS AND KEEP THEM SHORT
project: "DECam Templates"
campaign: "{year} Crosstalk"

payload:
  payloadName: "DECam/calib/ELAIS_pilot/crosstalk/{year}"
  butlerConfig: /global/cfs/cdirs/lsst/production/gen3/rubin/decam/repo/butler.yaml
  inCollection: DECam/raw/all,DECam/calib,DECam/calib/ELAIS_pilot/bias/{year}
  dataQuery: "instrument='DECam' AND exposure IN {FLATEXPS}" # First step
  # dataQuery: "instrument='DECam' AND exposure IN {SCIEXPS}" # Second step

extraQgraphOptions: "--dataset-query-constraint off"

# Second step
# clusterAlgorithm: lsst.ctrl.bps.quantum_clustering_funcs.dimension_clustering
# cluster:
 # cp_crosstalk_isr:
 #   pipetasks: cpCrosstalkIsr,cpCrosstalkExtract
 #   dimensions: detector
 #   partitionDimensions: exposure
 #   partitionMaxClusters: 1000

computeSite: "local"
wmsServiceClass: lsst.ctrl.bps.parsl.ParslService

parsl:
  log_level: INFO

site:
  local:
    class: lsst.ctrl.bps.parsl.sites.Local
    cores: 8
  triple_slurm:
    class: lsst.ctrl.bps.parsl.sites.TripleSlurm
    nodes: 1
    cores_per_node: 100
    qos: normal
    small_memory: 2.0     # Units are GB
    medium_memory: 4.0
    large_memory: 8.0
    small_walltime: 10.0   # Units are hours
    medium_walltime: 10.0
    large_walltime: 40.0
    monitorEnable: true
    monitorFilename: runinfo/monitoring.db
  task_vine:
    class: bps_parsl_sites.SlurmTaskVine
    walltime: "00:30:00"
    qos: regular
    constraint: cpu
    exclusive: true
    nodes_per_block: 1
    provider_options:
      init_blocks: 1
      min_blocks: 0
      max_blocks: 1
    scheduler_options: |
      #SBATCH --module=cvmfs
      #SBATCH --account=m1727
    worker_options: "--memory=480000"  # total memory in MB
    monitorEnable: true
    monitorFilename: runinfo/monitoring.db
