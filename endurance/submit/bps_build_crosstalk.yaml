# UPDATE THIS to the path to the pipeline to run
# This step produces the overscanRaws
# pipelineYaml: /global/homes/s/seanmacb/decam_template_tools/endurance/submit/crosstalkISR.yaml # First step for flat and science frame

# step 2
# This step produces crosstalk calib solutions
pipelineYaml: "/global/homes/s/seanmacb/decam_template_tools/endurance/submit/crosstalkStepFinal.yaml" # Second step

# Just names, but UPDATE THIS AND KEEP THEM SHORT
project: "DECam_Templates"
campaign: "Crosstalk_step2"

payload:
  payloadName: "DECam/calib/ELAIS_pilot/crosstalkSolutions"
  butlerConfig: /global/cfs/cdirs/lsst/production/gen3/rubin/decam/repo/butler.yaml
  inCollection: DECam/raw/all,DECam/calib,DECam/calib/ELAIS_pilot/bias,u/seanmacb/DECam/calib/ELAIS_pilot/crosstalk/20260830T141946Z # Last collection here has the cpCrosstalkIsrExps from step 1
  dataQuery: "instrument='DECam' AND exposure.observation_type IN ('dome flat','science') AND detector IN (16,54)"

extraQgraphOptions: "--dataset-query-constraint off"


# First step
# clusterAlgorithm: lsst.ctrl.bps.quantum_clustering_funcs.dimension_clustering
# cluster:
#   step0:
#     pipetasks: isrForCrosstalkSources
#     dimensions: detector
#     partitionDimensions: exposure
#     partitionMaxClusters: 1000

# Second step
clusterAlgorithm: lsst.ctrl.bps.quantum_clustering_funcs.dimension_clustering
cluster:
  cp_crosstalk_isr:
    pipetasks: cpCrosstalkIsr,cpCrosstalkExtract
    dimensions: detector
    partitionDimensions: exposure
    partitionMaxClusters: 1000

# cpCrosstalkSolve aggregates every extraction, so it is the memory-hungry
# step here. Inert while pipelineYaml points at DRP-Merian#step0; it applies
# once the cpCrosstalk.yaml second step is uncommented above.

pipetask:
  cpCrosstalkSolve:
    requestMemory: 32768

computeSite: "task_vine"
wmsServiceClass: lsst.ctrl.bps.parsl.ParslService

parsl:
  log_level: INFO

site:
  local:
    class: lsst.ctrl.bps.parsl.sites.Local
    cores: 8
  triple_slurm:
    class: lsst.ctrl.bps.parsl.sites.TripleSlurm
    nodes: 1
    cores_per_node: 100
    qos: normal
    small_memory: 2.0     # Units are GB
    medium_memory: 4.0
    large_memory: 8.0
    small_walltime: 10.0   # Units are hours
    medium_walltime: 10.0
    large_walltime: 40.0
    monitorEnable: true
    monitorFilename: runinfo/monitoring.db
  task_vine:
    class: bps_parsl_sites.SlurmTaskVine
    walltime: "04:00:00"
    qos: regular
    constraint: cpu
    exclusive: true
    nodes_per_block: 1
    provider_options:
      init_blocks: 1
      min_blocks: 0
      max_blocks: 1
    scheduler_options: |
      #SBATCH --module=cvmfs
      #SBATCH --account=m1727
    worker_options: "--memory=480000"  # total memory in MB
    monitorEnable: true
    monitorFilename: runinfo/monitoring.db
