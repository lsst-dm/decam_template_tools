year: "2016" # Options: 2013-2026, except 2015

# Update the year in each dayobs, first is year, second is year + 1
range: "AND (day_obs > 20160000) AND (day_obs < 20170000)"

# UPDATE THIS to the path to the pipeline to run
pipelineYaml: "$CP_PIPE_DIR/pipelines/DECam/cpBias.yaml"

# Just names, but UPDATE THIS AND KEEP THEM SHORT
project: "DECam_Templates"
campaign: "{year}_Bias"

payload:
  payloadName: "DECam/calib/ELAIS_pilot/bias/{year}"
  butlerConfig: /global/cfs/cdirs/lsst/production/gen3/rubin/decam/repo/butler.yaml
  inCollection: DECam/raw/all,DECam/calib
  dataQuery: "instrument='DECam' {range} AND exposure.observation_type='zero' AND exposure NOT IN (558294,581640,558395)" # Added the last query to remove some bad fits files that probably ingested incorrectly

extraQgraphOptions: "--dataset-query-constraint off"

clusterAlgorithm: lsst.ctrl.bps.quantum_clustering_funcs.dimension_clustering
cluster:
 cp_bias_isr:
   pipetasks: cpBiasIsr
   dimensions: detector
   partitionDimensions: exposure
   partitionMaxClusters: 1000

# cpBiasCombine stacks 236 exposures per detector. At the 2 GB global default all
# 62 quanta land on one node together and each takes ~27 min; giving it real memory
# lets TaskVine pack ~14 at a time and each finishes far faster.
pipetask:
  cpBiasCombine:
    requestMemory: 32768

computeSite: "task_vine"
wmsServiceClass: lsst.ctrl.bps.parsl.ParslService

parsl:
  log_level: INFO

site:
  local:
    class: lsst.ctrl.bps.parsl.sites.Local
    cores: 8
  triple_slurm:
    class: lsst.ctrl.bps.parsl.sites.TripleSlurm
    nodes: 1
    cores_per_node: 100
    qos: normal
    small_memory: 2.0     # Units are GB
    medium_memory: 4.0
    large_memory: 8.0
    small_walltime: 10.0   # Units are hours
    medium_walltime: 10.0
    large_walltime: 40.0
    monitorEnable: true
    monitorFilename: runinfo/monitoring.db
  task_vine:
    class: bps_parsl_sites.SlurmTaskVine
    walltime: "04:00:00"
    qos: regular
    constraint: cpu
    exclusive: true
    nodes_per_block: 1
    provider_options:
      init_blocks: 1
      min_blocks: 0
      max_blocks: 1
    scheduler_options: |
      #SBATCH --module=cvmfs
      #SBATCH --account=m1727
    worker_options: "--memory=480000"  # total memory in MB
    monitorEnable: true
    monitorFilename: runinfo/monitoring.db
